name: crew
version: 0.8.1
manifest_version: 2
api_version: 1
# Hermes refuses to load the plugin below this release (requires_hermes gate). 0.8.0 is the first crew that runs on
# Hermes's package-manager dependency layout; it still runs on the in-tree venv layout of 0.21.5.
requires_hermes: ">=0.21.5"
author: macd2
license: Apache-2.0
homepage: https://crew.forgecoreai.com
tags: [kanban, agents, coordinator, verification, multi-agent, workflow]
description: >
  Crew turns one chat message into verified work on the Hermes kanban board. /crew <ask> asks only what
  is missing, writes a card contract (goal, artifact, done-when, proof command, token budget) and hands it
  to a coordinator that owns the card until its proof command exits 0. One writer per card, an
  independent verifier that runs the proof itself, a per-card token budget as a hard stop, and a local
  dashboard of every card, run and step. /crew-status, /crew-graph and /crew-stop are plain commands with
  no model call; /crew-diagnose explains every stuck card.
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - post_api_request
  - api_request_error
  - on_kanban_dispatch_tick
# register() registers one skill at runtime: crew-verifier (ctx.register_skill). The other skills
# (crew, crew-role-worker, crew-role-content, crew-diagnose) ship as skills/<name>/SKILL.md and the
# installer copies them into <profile>/skills/crew/; plugin.yaml has no field for skills.
