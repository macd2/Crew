# This is how pull requests get tested: on GitHub's runners, never on a maintainer machine.
# A first-time contributor's run waits until a maintainer approves it (Settings > Actions > General >
# "Approval for running fork pull request workflows"). Read the diff before approving.
name: tests

on:
  workflow_dispatch:   # Actions tab > tests > Run workflow, on any branch, to run these checks by hand
  pull_request:
    branches: [main, '*.x']
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    # Windows runs the suite several times slower than Linux
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 15 }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12']
        include:
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      # Some tests build a real kanban board with Hermes's own code (tests/kernel_board.py), so the
      # suite needs hermes_cli. Hermes is not on PyPI at the plugin's floor (0.21.5), and building a
      # wheel is refused upstream, so: a pinned release tag, editable install, no account, no TTY.
      - name: Install Hermes (release tag v2026.9.24 = 0.21.5) and pytest
        run: |
          git clone --depth 1 --branch v2026.9.24 https://github.com/NousResearch/hermes-agent "$RUNNER_TEMP/hermes-agent"
          # a tag can be moved; the commit cannot
          test "$(git -C "$RUNNER_TEMP/hermes-agent" rev-parse HEAD)" = "f97608f178d1ffeca59860195ab7da295f7c8e5f"
          python -m pip install --upgrade pip
          python -m pip install -e "$RUNNER_TEMP/hermes-agent" pytest
      - name: Check the generated Desktop and browser bundles
        run: |
          npm ci --prefix ui
          node ui/build.mjs --check
      - name: Run the suite
        run: python -m pytest tests -q -rf --durations=15

  # The installer against a REAL Hermes, no fake: install twice into a throwaway HOME, then `install.py --check` must
  # say "nothing to change". A fake only knows the shapes its author thought of (PR #25); this catches the rest.
  # About 10 minutes, so it is its own job and the plain suite skips it (opt-in via CREW_REAL_HERMES=1).
  installer-converges:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Hermes (release tag v2026.9.24 = 0.21.5) and pytest
        run: |
          git clone --depth 1 --branch v2026.9.24 https://github.com/NousResearch/hermes-agent "$RUNNER_TEMP/hermes-agent"
          test "$(git -C "$RUNNER_TEMP/hermes-agent" rev-parse HEAD)" = "f97608f178d1ffeca59860195ab7da295f7c8e5f"
          python -m pip install --upgrade pip
          python -m pip install -e "$RUNNER_TEMP/hermes-agent" pytest
          echo "HERMES_AGENT_DIR=$RUNNER_TEMP/hermes-agent" >> "$GITHUB_ENV"
          hermes --version
      - name: Real-Hermes installer convergence
        env:
          CREW_REAL_HERMES: '1'
        run: python -m pytest tests/test_installer_converges_real_hermes.py -q -rf

  # The unit suite above runs crew on Windows with Hermes installed as a Python package. This job is the other
  # half: a native Windows Hermes laid out by Hermes's own install.ps1 (venv\Scripts\python.exe, Lib\site-packages,
  # %LOCALAPPDATA%\hermes\hermes-agent, Git Bash), crew installed into a profile by its real installer, and
  # tests/e2e/windows_native.py walking the paths that break on that layout. It fails on any step.
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    env:
      HERMES_TAG: v2026.9.24
      HERMES_COMMIT: f97608f178d1ffeca59860195ab7da295f7c8e5f
      PYTHONUTF8: '1'
      # The model for the one real card run (step "A real crew card ..."): change these four to swap it. Hermes's
      # `custom` provider pointed at Gemini's OpenAI-compatible URL (Groq's free tier caps a request at 8000 tokens,
      # below one Hermes worker turn).
      # The key itself comes from the repository secret named in the step's `env:` below.
      CREW_E2E_PROVIDER: custom
      CREW_E2E_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai
      CREW_E2E_MODEL: gemini-flash-lite-latest
      CREW_E2E_KEY_ENV: GEMINI_API_KEY
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # The documented headless install on native Windows: Hermes's install.ps1, -NonInteractive, pinned to the
      # commit of the release tag (a tag can be moved; the commit cannot). The script is fetched at that commit.
      - name: Install Hermes the way a native Windows user does (install.ps1 -NonInteractive)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $script = Join-Path $env:RUNNER_TEMP 'install.ps1'
          # Through the API with the job's token (anonymous raw.githubusercontent.com gets 429 on shared runners), with retries.
          $hdr = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github.raw' }
          foreach ($n in 1..5) {
            try { Invoke-WebRequest -UseBasicParsing -ErrorAction Stop -Headers $hdr -Uri "https://api.github.com/repos/NousResearch/hermes-agent/contents/scripts/install.ps1?ref=$env:HERMES_COMMIT" -OutFile $script; break }
            catch { if ($n -eq 5) { throw }; Write-Host "install.ps1 download try ${n}: $($_.Exception.Message)"; Start-Sleep -Seconds (15 * $n) }
          }
          $home_ = Join-Path $env:LOCALAPPDATA 'hermes'
          # The script's fresh clone sometimes dies at its `git checkout <pin>` ("local changes would be
          # overwritten", a docs file in a fresh Windows clone) and still exits 0, so success is judged by what a
          # user would check: Hermes is at the pinned commit and has its venv. A user would simply run the script
          # again, which then takes its update path (it stashes the stray change); a third try starts empty.
          $agent = Join-Path $home_ 'hermes-agent'
          # The runner's git has core.autocrlf=true; a docs file stored with CRLF then reads as modified as soon as
          # anything touches it during the 75 s the script spends fetching the pin. Hermes's own checkout, not crew's.
          git config --global core.autocrlf false
          foreach ($try in 1..3) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Commit $env:HERMES_COMMIT -NonInteractive -SkipComputerUse
            $rc = $LASTEXITCODE
            $head = if (Test-Path (Join-Path $agent '.git')) { (git -C $agent rev-parse HEAD).Trim() } else { '' }
            if ($rc -eq 0 -and $head -eq $env:HERMES_COMMIT -and (Test-Path (Join-Path $agent 'venv\Scripts\python.exe'))) { break }
            Write-Host "install.ps1 try ${try}: exit $rc, Hermes at '$head' (want $env:HERMES_COMMIT)"
            if ($try -eq 3) { throw "install.ps1 did not produce the pinned Hermes in three tries" }
            if ($try -eq 2) { Remove-Item -Recurse -Force $agent -ErrorAction SilentlyContinue }
          }
          Add-Content -ErrorAction Stop -Path $env:GITHUB_PATH -Value (Join-Path $home_ 'bin')
          Get-ChildItem $home_ | Select-Object Name | Format-Table -HideTableHeaders
      - name: Hermes install log (on failure)
        if: failure()
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'hermes\logs\install.log'
          if (Test-Path $log) { Get-Content $log -Tail 120 } else { 'no install.log' }
      - name: Create a profile and install crew into it (WINDOWS.md, Route B)
        run: |
          hermes --version
          if ($LASTEXITCODE -ne 0) { throw "hermes --version failed ($LASTEXITCODE)" }
          hermes profile create e2e --no-alias --no-skills
          if ($LASTEXITCODE -ne 0) { throw "hermes profile create failed ($LASTEXITCODE)" }
          python install.py --profile e2e --no-cron
          if ($LASTEXITCODE -ne 0) { throw "install.py failed ($LASTEXITCODE)" }
          python install.py --check --profile e2e
          if ($LASTEXITCODE -ne 0) { throw "install.py --check failed ($LASTEXITCODE)" }
          hermes -p e2e plugins list
          if ($LASTEXITCODE -ne 0) { throw "hermes plugins list failed ($LASTEXITCODE)" }
      - name: Walk crew's Windows paths against that install
        run: |
          python tests/e2e/windows_native.py --profile e2e
          if ($LASTEXITCODE -ne 0) { throw "windows_native.py failed ($LASTEXITCODE)" }
      # Push builds only (forks and pull requests have no secret). Without the secret the script prints SKIPPED and
      # exits 0. The key is only ever an environment variable of this step: never echoed, never written to a file.
      - name: A real crew card, worked by a real model (skips without the secret)
        if: github.event_name == 'push'
        env:
          CREW_E2E_KEY: ${{ secrets.GEMINI_API_TOKEN }}
        timeout-minutes: 20
        run: |
          python tests/e2e/windows_native.py --profile e2e --only card-run
          if ($LASTEXITCODE -ne 0) { throw "card-run failed ($LASTEXITCODE)" }
