# Applied by install.py into the profile's config.yaml.
# key = value; [a,b,c] is a YAML list. Edit before installing.
crew.role = coordinator
model.provider = anthropic
model.default = claude-opus-5-5
model.base_url = https://api.anthropic.com
# A role run must not be silently re-routed to another model: retry, never substitute.
fallback_providers = []
# It decides, it does not do: no subagents, no scripts. File writes and board changes are blocked by the
# plugin's guard during the decision turn (CREW_COORDINATOR_TURN), which `file` cannot express per tool.
agent.disabled_toolsets = [cronjob,memory,computer_use,todo,tts,delegation,code_execution]
# Toolsets of a card run (a kanban worker is a `chat` run, so the cli platform list applies). It decides, it does not do: the board, files and a shell to read the facts. Nothing else is in its tool list.
# Every toolset listed here is prompt tokens on every call; the kernel names are `file` (read/write/patch/search), `web`, `terminal`, `kanban`.
platform_toolsets.cli = [kanban,file,terminal]
# Role profiles run with no MCP servers: a crew card never needs the ad/Brevo tool schemas,
# and they cost prompt tokens on every call. Delete this line to give the role its own servers.
mcp_servers = []
# Slack stays with crew-content, the only profile holding a Slack credential. A role profile
# cloned from the installing profile inherits its SLACK_* env and would start a second Slack
# on the same token (gateway: duplicate_credential, fatal). Explicit off wins over env creds.
platforms.slack.enabled = false
platform_toolsets.slack = []
# The coordinator loop owns every crew card: the kernel's own triage decomposer must never rewrite one, and the
# orchestrator named here is the coordinator profile ({prefix} is the installer's --profile-prefix).
kanban.auto_decompose = false
kanban.orchestrator_profile = {prefix}coordinator
# Skills: a role profile keeps skills/crew/ (the role skills this package ships) and nothing else, so its
# first API call carries no skills index and the clone's 47 MB skills tree is gone. Name the extra skills
# this role needs, as paths under the installing profile's skills dir: skills_extra = [devops/some-skill]
skills_extra = []
