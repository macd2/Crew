# Applied by install.py into the profile's config.yaml.
# key = value; [a,b,c] is a YAML list. Edit before installing.
crew.role = worker
model.provider = anthropic
model.default = claude-opus-5-5
model.base_url = https://api.anthropic.com
# Ships empty: a role run retries rather than swapping models on its own. An owner may name fallback
# providers for the role in their template override (templates/README.md).
fallback_providers = []
agent.disabled_toolsets = [cronjob,memory,computer_use,todo,tts]
# Iteration cap for one run (the kernel's key is agent.max_turns). The kernel warns at 90% of it (54), and the
# token budget stays the outer stop. A run that burns its iterations on failing calls is stopped earlier by the
# plugin's thrash stop (roles.json max_consecutive_failures, max_window_failures).
agent.max_turns = 60
# Toolsets of a card run (a kanban worker is a `chat` run, so the cli platform list applies). Only what a card needs to do and prove its work: shell, files (read, write, patch), web, the board. A role that needs more (browser, vision) names it here, not in the profile by hand.
# Every toolset listed here is prompt tokens on every call; the kernel names are `file` (read/write/patch/search), `web`, `terminal`, `kanban`.
platform_toolsets.cli = [terminal,file,web,kanban,crew]
# What the role profile takes from which profile (it is created bare, nothing else is copied): a profile name,
# owner (the profile crew is installed from) or false; skills and mcp also take [name, profile/name] (exactly those,
# a bare name from the owner) or {"from": owner, "add": [...], "drop": [...]} as JSON (crew-home/lineups/README.md).
# env = .env plus the credential sections (secrets, vault, providers); hooks = the config.yaml hooks section.
# No MCP servers: a crew card never needs their tool schemas, and they cost prompt tokens on every call.
inherit.env = owner
inherit.hooks = owner
inherit.skills = false
inherit.mcp = false
# Slack stays with crew-content, the only profile holding a Slack credential. A role profile
# cloned from the installing profile inherits its SLACK_* env and would start a second Slack
# on the same token (gateway: duplicate_credential, fatal). Explicit off wins over env creds.
platforms.slack.enabled = false
platform_toolsets.slack = []
# The coordinator loop owns every crew card: the kernel's own triage decomposer must never rewrite one, and the
# orchestrator named here is the coordinator profile ({prefix} is the installer's --profile-prefix).
kanban.auto_decompose = false
kanban.orchestrator_profile = {prefix}coordinator
# Skills: a role profile keeps skills/crew/ (the role skills this package ships) and nothing else, so its
# first API call carries no skills index and the clone's 47 MB skills tree is gone. Name the extra skills
# this role needs, as paths under the installing profile's skills dir: skills_extra = [devops/some-skill]
skills_extra = []
